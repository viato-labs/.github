<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket Flow</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <strong>Ticket Flow</strong>
        <small>Chrome agent · your Jira login</small>
      </div>
      <button id="btn-open" type="button" class="create">Open Jira</button>
    </header>

    <div class="layout">
      <aside class="rail">
        <p class="label">Accounts</p>
        <div id="account-list" class="account-list"></div>
        <button id="btn-add-toggle" type="button" class="link">+ Add company</button>
        <form id="add-form" class="add-form hidden">
          <input id="add-name" placeholder="Company name" required />
          <input id="add-url" placeholder="https://company.atlassian.net" required />
          <button type="submit">Save</button>
        </form>
        <p id="session" class="session">Open Jira while logged in.</p>
      </aside>

      <main class="main">
        <label class="field">
          <span>Jira URL</span>
          <div class="row">
            <input id="jira-url" placeholder="https://christies.atlassian.net" />
            <button id="btn-save-url" type="button" class="ghost">Save</button>
          </div>
        </label>

        <label class="field">
          <span>Tickets are for</span>
          <select id="audience">
            <option value="both">Dev + QA</option>
            <option value="dev">Developers</option>
            <option value="qa">QA</option>
            <option value="analysis">Analysis first</option>
          </select>
        </label>

        <label class="field">
          <span>Guidance</span>
          <textarea
            id="guidance"
            rows="7"
            placeholder="Paste the brief, notes, or “turn this into tickets”. Add Figma/Confluence links below. I’ll write like you, using existing Jira + Confluence context."
          ></textarea>
        </label>

        <label class="field">
          <span>Links (Figma, Confluence, docs)</span>
          <textarea id="links" rows="3" placeholder="One URL per line"></textarea>
        </label>

        <div class="actions">
          <button id="btn-session" type="button" class="ghost">Check login</button>
          <button id="btn-draft" type="button" class="primary">Research & draft</button>
          <button id="btn-create" type="button" class="primary" disabled>Create in Jira</button>
        </div>

        <div id="out" class="out" aria-live="polite"></div>
      </main>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
